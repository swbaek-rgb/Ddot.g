<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Don't 땃쥐 me</title>
<style>
  /* 점수: 승리의 그날까지(TVC) — 숫자만 쓰므로 라틴 서브셋. 재배포 금지 라이선스라 공식 CDN 링크 사용 */
  @font-face {
    font-family: 'TillVictoryComes';
    src: url('https://cdn.jsdelivr.net/gh/tillvictorycomes/TillVictoryComes-font/tillvictorycomes-Regular-latin.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  /* 나머지 텍스트: 조선굴림체 */
  @font-face {
    font-family: 'ChosunGu';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/ChosunGu.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #111;
    touch-action: none; overscroll-behavior: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  body { font-family: "ChosunGu", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

  #stage-wrap {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 1024px;
    transform-origin: center center;
  }
  .screen {
    position: absolute; inset: 0; overflow: hidden;
    display: none;
  }
  .screen.active { display: block; }
  .abs { position: absolute; }

  /* ── 가로(1440×1024) 레이아웃 좌표 ── */
  #st-bubble   { left: 125px;    top: 38.2px;  width: 777px; }
  #st-dont     { left: 366.9px;  top: 201.7px; width: 307px; }
  #st-ttatjwi  { left: 303.7px;  top: 384px;   width: 304px; }
  #st-me       { left: 514.2px;  top: 575.1px; width: 172px; }
  #st-mouse    { left: 626.8px;  top: 166.8px; width: 590px; }
  #btn-start   { left: 520px;    top: 722.5px; width: 178px; height: 101px; }
  #st-dash     { left: 432px;    top: 841.5px; width: 164px; height: 80px; }
  #st-share    { left: 627px;    top: 841.5px; width: 164px; height: 80px; }

  #mouse1-img, #mouse-eat1, #mouse-eat2 { left: 380.5px; top: 162.5px; width: 642px; }
  #mouse2-img  { left: 338.1px;  top: 177.1px; width: 654px; }
  #mouse3-img  { left: 88.8px;   top: 82.6px;  width: 1352px; }
  #caption1    { top: 902px; }

  #ov-bubble   { left: 30px;     top: 65.7px;  width: 777px; }
  #ov-dont     { left: 271.9px;  top: 229.2px; width: 307px; }
  #ov-ttatjwi  { left: 208.7px;  top: 411.5px; width: 304px; }
  #ov-me       { left: 419.2px;  top: 602.5px; width: 172px; }
  #ov-mouse    { left: 531.8px;  top: 194.3px; width: 590px; }
  #ov-gameover { left: 1072.4px; top: 74.1px;  width: 292px; }
  #btn-retry   { left: 1140px;   top: 347px;   width: 228px; height: 101px; }
  #ov-dash     { left: 1204px;   top: 464px;   width: 164px; height: 80px; }
  #ov-share    { left: 1204px;   top: 560px;   width: 164px; height: 80px; }
  #nick-form   { left: 1140px;   top: 668px;   width: 228px; }
  #ov-msg      { top: 916px; left: auto; right: 72px; width: 621px; }

  /* ── 배경 (Figma 프레임 페인트 그대로) ── */
  #screen-start    { background: linear-gradient(180deg, #888888 0%, #1A1818 100%); }
  #screen-game     { background: linear-gradient(180deg, #888888 0%, #B1B1B1 100%); }
  #screen-game.st3 { background: #888888; }
  #screen-over     { background: linear-gradient(180deg, #888888 0%, #B1B1B1 100%); }

  .vignette {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle closest-side, #252525 3.7%, rgba(102,102,102,0) 100%);
  }
  .vig-1825 { left: -457px; top: -611px; width: 1825px; height: 1825px; }
  .vig-2442 { left: -1042px; top: -1068px; width: 2442px; height: 2442px; }

  /* ── 점수 ── */
  .score {
    position: absolute; left: 60px; top: 60px;
    font-family: 'TillVictoryComes', sans-serif;
    font-size: 112px; font-weight: normal; color: #111;
    letter-spacing: 2px; user-select: none;
  }
  .score.bump { animation: bump .15s ease-out; }
  @keyframes bump { 50% { transform: scale(1.08); } }

  /* ── 버튼 (Figma 프레임 위치/크기) ── */
  .btn {
    position: absolute; display: flex; align-items: center; justify-content: center;
    background: #fff; border: 3px solid #111; border-radius: 18px;
    font-weight: 800; color: #111; cursor: pointer; user-select: none;
    transition: transform .08s ease, background .08s ease;
  }
  .btn:hover { background: #f1f1f1; transform: scale(1.03); }
  .btn:active { transform: scale(.97); }
  .btn-lg { font-size: 42px; }
  .btn-sm { font-size: 24px; border-radius: 14px; }

  .caption {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 34px; font-weight: 600; color: #111; user-select: none;
  }

  .danger-box {
    position: absolute; left: 662px; top: 892px; width: 116px; height: 68px;
    background: #fff; border: 3px solid #111; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #111;
    animation: blink .35s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  /* ── 게임 상태 레이어 ── */
  .state-layer { position: absolute; inset: 0; display: none; }
  .state-layer.on { display: block; }
  img { -webkit-user-drag: none; user-select: none; }

  #mouse1-img.petting { animation: rock .35s ease-in-out infinite; transform-origin: 55% 90%; }
  @keyframes rock { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-1.6deg); } }

  #stage-wrap.shake { animation: shake .4s linear; }
  @keyframes shake {
    0%,100% { margin-left: 0; } 20% { margin-left: -18px; }
    40% { margin-left: 16px; } 60% { margin-left: -12px; } 80% { margin-left: 8px; }
  }

  /* ── 타임어택: 남은 시간 ── */
  #timer {
    position: absolute; left: 64px; top: 212px; display: none;
    font-family: 'TillVictoryComes', sans-serif; font-size: 76px; color: #111;
    user-select: none;
  }
  #timer.low { animation: blink .5s steps(2) infinite; }
  body.portrait #timer { left: 42px; top: 152px; font-size: 58px; }

  /* ── 간식(밀웜): 잠깐 나타났다 사라진다 ── */
  .snack { position: absolute; width: 114px; z-index: 10; cursor: pointer; }
  .snack img {
    width: 100%; display: block; pointer-events: none;
    animation: snackPop .3s ease-out, snackWiggle 1.1s ease-in-out .3s infinite;
  }
  .snack.out img { animation: snackOut .28s ease-in forwards; }
  @keyframes snackPop { 0% { transform: scale(0); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes snackWiggle { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes snackOut { to { transform: scale(0); opacity: 0; } }

  /* ── 식사모드 하트: 흩날리듯 떠올랐다 사라진다 ── */
  .heart { position: absolute; pointer-events: none; z-index: 9; animation: heartFloat 1.3s ease-out forwards; }
  .heart img { display: block; }
  @keyframes heartFloat {
    0%   { opacity: 0; transform: translate(0, 14px) scale(.55) rotate(-8deg); }
    18%  { opacity: 1; transform: translate(calc(var(--dx, 20px) * .2), -8px) scale(1) rotate(3deg); }
    100% { opacity: 0; transform: translate(var(--dx, 20px), -130px) scale(1.08) rotate(10deg); }
  }

  /* ── 식사모드 안내 ── */
  .eat-badge {
    position: absolute; left: 50%; transform: translateX(-50%); top: 852px;
    background: #fff; border: 3px solid #111; border-radius: 12px;
    padding: 10px 30px; font-size: 30px; font-weight: 800; color: #111;
    white-space: nowrap;
  }
  #caption-eat { top: 936px; }
  body.portrait .eat-badge  { top: 1028px; }
  body.portrait #caption-eat { top: 1108px; }

  /* 위험(상태2) 안내 */
  #caption-danger { top: 972px; font-size: 30px; }
  body.portrait #caption-danger { top: 1150px; font-size: 25px; }

  /* ── 득점 플로터: 쓰다듬는 곳 옆에 +00 이 떠올랐다 사라진다 ── */
  .float-pt {
    position: fixed; pointer-events: none; z-index: 98;
    font-family: "ChosunGu", sans-serif; font-size: 30px; font-weight: 700;
    color: #111; text-shadow: 0 0 6px rgba(255,255,255,.55);
    animation: floatUp .9s ease-out forwards;
  }
  .float-pt.bonus { font-size: 38px; color: #fff; text-shadow: 0 0 6px rgba(0,0,0,.6); }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 8px) scale(.85); }
    18%  { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -64px) scale(1); }
  }

  /* ── 커서 ── */
  #cursor {
    position: fixed; left: 0; top: 0; width: 190px; pointer-events: none;
    display: none; z-index: 99; transform: translate(-16px, -10px);
  }
  #cursor img { width: 100%; display: block; }
  body.playing, body.playing * { cursor: none !important; }

  /* ── 모드 고르기 오버레이 (Figma 156:156) ── */
  #mode {
    position: absolute; inset: 0; z-index: 40; display: none;
    background: rgba(17, 17, 17, .1);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #mode.open { display: block; }
  .mode-slot { position: absolute; width: 549px; height: 745px; }
  #mode-normal     { left: 115px; top: 136px; }
  #mode-timeattack { left: 720px; top: 136px; }
  .mode-card {
    position: absolute; inset: 0;
    border: 4px solid #000; border-radius: 16px;
    background: linear-gradient(180deg, #FFFFFF 0%, #B5B5B5 100%);
  }
  /* 말풍선: 카드 밖으로 삐져나온다 (미회전 벡터를 -15° 회전) */
  .burst-box { position: absolute; width: 635.6px; height: 407.5px; transform: rotate(-15deg); pointer-events: none; }
  #mode-normal     .burst-box { left: -82.4px; top: 6.5px; }
  #mode-timeattack .burst-box { left: -78.4px; top: 10.5px; }
  .burst-box img { width: 100%; height: 100%; display: block; }
  .mode-title { position: absolute; pointer-events: none; }
  #mn-title  { left: 157.9px; top: 145.1px; width: 231px; }
  #mt-title  { left: 120.1px; top: 138.1px; width: 328px; }
  /* 시계 패턴: 카드보다 크고 카드 모서리에 맞춰 잘린다 */
  .clock-clip { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; }
  #mt-clocks { position: absolute; left: -36.5px; top: 14.2px; width: 679.8px; height: 753px; }
  .mode-desc {
    position: absolute; left: 50%; transform: translateX(-50%); width: 413px; top: 429px;
    text-align: center; font-size: 38px; line-height: 1.3; color: #1A1818;
    word-break: keep-all;
  }
  #mode-timeattack .mode-desc { top: 387px; }
  /* 모바일: 문장 단위로 줄바꿈 */
  body.portrait .mode-desc { width: 620px; }
  body.portrait .mode-desc span { display: block; }
  body.portrait #mode-timeattack .mode-desc { top: 415px; }
  .mode-start { left: 166px; top: 579px; width: 218px; height: 101px; border-width: 4px; }

  body.portrait .mode-slot { transform: scale(0.72); transform-origin: top left; }
  body.portrait #mode-normal     { left: 162px; top: 60px; }
  body.portrait #mode-timeattack { left: 162px; top: 684px; }
  /* 세로에서는 카드를 좌우로 넓혀 상하/좌우 바깥 여백을 60px로 통일 (말풍선 크기는 유지) */
  body.portrait .mode-card { left: -142.4px; right: -142.4px; }
  body.portrait #mode-normal     .burst-box { left: -224.8px; }
  body.portrait #mode-timeattack .burst-box { left: -220.8px; }
  body.portrait #mn-title { left: 15.5px; }
  body.portrait #mt-title { left: -22.3px; }
  body.portrait #mt-clocks { width: 1033px; height: 1144px; }

  /* ── 대시보드 오버레이 ── */
  #dash {
    position: absolute; inset: 0; display: none; z-index: 50;
    background: rgba(0,0,0,.55); align-items: center; justify-content: center;
  }
  #dash.open { display: flex; }
  #dash .panel {
    background: #fff; border: 4px solid #111; border-radius: 24px;
    padding: 56px 88px; text-align: center;
  }
  #dash h2 { font-size: 44px; margin-bottom: 20px; }

  /* 순위표 모드 탭 */
  #board-tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
  .board-tab {
    padding: 10px 26px; border: 3px solid #111; border-radius: 999px;
    font-size: 22px; font-weight: 700; color: #111; cursor: pointer; user-select: none;
  }
  .board-tab.active { background: #111; color: #fff; }

  /* ── 순위표: 상위 8명, 1위는 크게 강조 ── */
  #board { list-style: none; min-width: 380px; margin-bottom: 32px; }
  #board li {
    display: flex; align-items: baseline; gap: 16px;
    font-size: 24px; padding: 6px 4px; color: #111;
  }
  #board li .rank { width: 40px; text-align: right; color: #888; }
  #board li .name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board li .pts  { font-family: 'TillVictoryComes', sans-serif; font-size: 28px; }
  #board li.top {
    font-size: 40px; font-weight: 700;
    border-bottom: 3px solid #111; padding-bottom: 12px; margin-bottom: 8px;
  }
  #board li.top .rank { color: #111; }
  #board li.top .pts { font-size: 52px; }
  #board .empty { justify-content: center; color: #888; }

  /* ── 닉네임 등록 ── */
  #nick-form input {
    width: 100%; height: 56px; display: block;
    background: #fff; border: 3px solid #111; border-radius: 14px;
    font-family: inherit; font-size: 22px; text-align: center; color: #111;
  }
  #nick-form input:focus { outline: 3px solid #555; }
  #nick-form.done .btn { pointer-events: none; opacity: .55; }

  #toast {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: #111; color: #fff; padding: 14px 28px; border-radius: 999px;
    font-size: 24px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60;
  }
  #toast.show { opacity: 1; }

  /* ══ 세로(720×1280) 레이아웃 — body.portrait 일 때 적용 ══ */
  body.portrait #st-bubble   { left: 25px;  top: 50px;  width: 600px; }
  body.portrait #st-dont     { left: 212px; top: 176px; width: 237px; }
  body.portrait #st-ttatjwi  { left: 163px; top: 317px; width: 235px; }
  body.portrait #st-me       { left: 326px; top: 464px; width: 133px; }
  body.portrait #st-mouse    { left: 290px; top: 560px; width: 400px; }
  body.portrait #btn-start   { left: 271px; top: 1010px; width: 178px; height: 90px; }
  body.portrait #st-dash     { left: 181px; top: 1128px; width: 164px; height: 76px; }
  body.portrait #st-share    { left: 375px; top: 1128px; width: 164px; height: 76px; }

  body.portrait .score       { left: 40px; top: 36px; font-size: 92px; }
  body.portrait #mouse1-img, body.portrait #mouse-eat1, body.portrait #mouse-eat2 { left: 60px; top: 330px; width: 600px; }
  body.portrait #mouse2-img  { left: 55px;   top: 330px; width: 600px; }
  body.portrait #mouse3-img  { left: -435px; top: 0;  width: 1837px; } /* 세로 풀블리드 크롭 */
  body.portrait #caption1    { top: 1150px; }
  body.portrait .caption     { font-size: 27px; }
  body.portrait .danger-box  { left: 302px; top: 1064px; }

  body.portrait #ov-gameover { left: 400px; top: 40px;  width: 280px; }
  body.portrait #ov-bubble   { left: 20px;  top: 250px; width: 450px; }
  body.portrait #ov-dont     { left: 160px; top: 345px; width: 178px; }
  body.portrait #ov-ttatjwi  { left: 124px; top: 450px; width: 176px; }
  body.portrait #ov-me       { left: 245px; top: 561px; width: 100px; }
  body.portrait #ov-mouse    { left: 360px; top: 500px; width: 330px; }
  body.portrait #ov-msg      { top: 905px; left: 0; right: 0; width: auto; font-size: 25px; }
  body.portrait #nick-form   { left: 180px; top: 962px; width: 360px; }
  body.portrait #nick-form input  { height: 52px; }
  body.portrait #nick-form .btn   { height: 52px !important; margin-top: 8px !important; }
  body.portrait #btn-retry   { left: 96px;  top: 1130px; width: 180px; height: 76px; font-size: 32px; }
  body.portrait #ov-dash     { left: 296px; top: 1130px; width: 150px; height: 76px; }
  body.portrait #ov-share    { left: 466px; top: 1130px; width: 150px; height: 76px; }

  body.portrait .float-pt        { font-size: 24px; }
  body.portrait .float-pt.bonus  { font-size: 30px; }
  body.portrait #dash .panel     { padding: 40px 44px; }
  body.portrait #board           { min-width: 320px; }
</style>
</head>
<body>
<div id="stage-wrap">

  <!-- ══ 시작화면 ══ -->
  <section id="screen-start" class="screen active">
    <img class="abs" id="st-bubble"  src="assets/bubble.svg">
    <img class="abs" id="st-dont"    src="assets/txt-dont.svg">
    <img class="abs" id="st-ttatjwi" src="assets/txt-ttatjwi.svg">
    <img class="abs" id="st-me"      src="assets/txt-me.svg">
    <img class="abs" id="st-mouse"   src="assets/mouse-start.svg">
    <div class="btn btn-lg" id="btn-start">Start</div>
    <div class="btn btn-sm" id="st-dash"  data-act="dash">대시보드</div>
    <div class="btn btn-sm" id="st-share" data-act="share">공유하기</div>
  </section>

  <!-- ══ 게임화면 ══ -->
  <section id="screen-game" class="screen">
    <!-- 상태1 : 한눈팔기 -->
    <div class="state-layer on" id="layer-1">
      <img id="mouse1-img" class="abs" src="assets/mouse-state1.svg">
      <div class="caption" id="caption1">스페이스바 또는 클릭으로 땃쥐를 쓰다듬자.</div>
    </div>
    <!-- 상태2 : 고개 돌림 -->
    <div class="state-layer" id="layer-2">
      <div class="vignette vig-1825"></div>
      <img id="mouse2-img" class="abs" src="assets/mouse-state2.svg">
      <div class="danger-box">위험!!</div>
      <div class="caption" id="caption-danger">이때 쓰다듬으면 점수 2.5배! 하지만 언제 터질지 모른다...</div>
    </div>
    <!-- 상태3 : 폭발 직전 -->
    <div class="state-layer" id="layer-3">
      <div class="vignette vig-2442"></div>
      <img id="mouse3-img" class="abs" src="assets/mouse-state3.svg">
    </div>
    <!-- 식사모드 : 간식 먹는 중 (안전) -->
    <div class="state-layer" id="layer-eat">
      <img id="mouse-eat1" class="abs" src="assets/mouse-eat1.svg">
      <img id="mouse-eat2" class="abs" src="assets/mouse-eat2.svg" style="display:none;">
      <div class="eat-badge">식사 모드</div>
      <div class="caption" id="caption-eat">아무리 눌러도 뒤돌아보지 않는 상태! 마음껏 쓰다듬자.</div>
    </div>
    <div class="score" id="score-game">000</div>
    <div id="timer">60</div>
  </section>

  <!-- ══ 게임오버 ══ -->
  <section id="screen-over" class="screen">
    <div class="vignette vig-1825"></div>
    <img class="abs" id="ov-bubble"   src="assets/bubble.svg">
    <img class="abs" id="ov-dont"     src="assets/txt-dont.svg">
    <img class="abs" id="ov-ttatjwi"  src="assets/txt-ttatjwi.svg">
    <img class="abs" id="ov-me"       src="assets/txt-me.svg">
    <img class="abs" id="ov-mouse"    src="assets/mouse-start.svg">
    <img class="abs" id="ov-gameover" src="assets/txt-gameover.svg">
    <div class="btn btn-lg" id="btn-retry">다시시작</div>
    <div class="btn btn-sm" id="ov-dash"  data-act="dash">대시보드</div>
    <div class="btn btn-sm" id="ov-share" data-act="share">공유하기</div>
    <!-- 닉네임 기록 등록 -->
    <div class="abs" id="nick-form">
      <input id="nick-input" maxlength="8" placeholder="닉네임" autocomplete="off">
      <div class="btn btn-sm" id="btn-nick" style="position:relative; width:100%; height:56px; margin-top:10px;">기록 등록</div>
    </div>
    <div class="score" id="score-over">000</div>
    <div class="caption" id="ov-msg" style="text-align:center;">땃쥐의 심기를 제대로 건드려버렸다...</div>
  </section>

  <!-- 모드 고르기 오버레이 -->
  <div id="mode">
    <div class="mode-slot" id="mode-normal">
      <div class="mode-card"></div>
      <div class="burst-box"><img src="assets/mode-burst.svg"></div>
      <img class="mode-title" id="mn-title" src="assets/txt-mode-normal.svg">
      <div class="mode-desc"><span>아이템과 시간제한이 없는</span> <span>순수 실력 경쟁.</span></div>
      <div class="btn btn-lg mode-start" data-mode="normal">Start</div>
    </div>
    <div class="mode-slot" id="mode-timeattack">
      <div class="mode-card"><div class="clock-clip"><img id="mt-clocks" src="assets/mode-clocks.svg"></div></div>
      <div class="burst-box"><img src="assets/mode-burst.svg"></div>
      <img class="mode-title" id="mt-title" src="assets/txt-mode-timeattack.svg">
      <div class="mode-desc"><span>정해진 시간 안에 많은 점수 내기.</span> <span>간식을 먹여 시간을 끌자!</span></div>
      <div class="btn btn-lg mode-start" data-mode="timeattack">Start</div>
    </div>
  </div>

  <!-- 대시보드 오버레이 -->
  <div id="dash">
    <div class="panel">
      <h2>순위표</h2>
      <div id="board-tabs">
        <div class="board-tab active" data-board="normal">일반 모드</div>
        <div class="board-tab" data-board="timeattack">타임어택!</div>
      </div>
      <ol id="board"></ol>
      <div class="btn btn-sm" style="position:relative; width:164px; height:64px; margin:0 auto;" id="btn-dash-close">닫기</div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<!-- 커스텀 커서 -->
<div id="cursor"><img id="cursor-img" src="assets/hand1.svg"></div>


<script>
(() => {
  'use strict';

  // ── 화면 스케일링: 가로 1440×1024, 세로 720×1280 캔버스를 방향에 따라 전환 ──
  const wrap = document.getElementById('stage-wrap');
  function fit() {
    const portrait = innerHeight > innerWidth;
    document.body.classList.toggle('portrait', portrait);
    const W = portrait ? 720 : 1440;
    const H = portrait ? 1280 : 1024;
    wrap.style.width = W + 'px';
    wrap.style.height = H + 'px';
    const s = Math.min(innerWidth / W, innerHeight / H);
    wrap.style.transform = `translate(-50%, -50%) scale(${s})`;
    // 커서는 화면(고정) 좌표라 스테이지 배율에 맞춰 크기만 조정
    const c = document.getElementById('cursor');
    if (c) c.style.width = Math.max(90, Math.round(190 * s)) + 'px';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  // ── DOM ──
  const screens = {
    start: document.getElementById('screen-start'),
    game:  document.getElementById('screen-game'),
    over:  document.getElementById('screen-over'),
  };
  const layers = [null,
    document.getElementById('layer-1'),
    document.getElementById('layer-2'),
    document.getElementById('layer-3')];
  const scoreGameEl = document.getElementById('score-game');
  const scoreOverEl = document.getElementById('score-over');
  const mouse1Img   = document.getElementById('mouse1-img');
  const cursorEl    = document.getElementById('cursor');
  const cursorImg   = document.getElementById('cursor-img');
  const toastEl     = document.getElementById('toast');

  const BEST_KEY  = 'ttatjwi-best';
  const BOARD_KEY = 'ttatjwi-board';
  const NICK_KEY  = 'ttatjwi-nick';
  const nickForm  = document.getElementById('nick-form');
  const nickInput = document.getElementById('nick-input');
  const btnNick   = document.getElementById('btn-nick');
  const boardEl   = document.getElementById('board');

  // ── Supabase 공용 랭킹 (실패 시 이 기기의 localStorage 기록으로 동작) ──
  const SB_URL = 'https://rejbmvzkgyiqwfvnjiwr.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlamJtdnprZ3lpcXdmdm5qaXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjY5MjAsImV4cCI6MjEwNDYwMjkyMH0.D7u_VADNKsWBea4kkraYprnBaqIv4F_sqI_CnSJ5SS4';
  const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

  let boardMode = 'normal'; // 대시보드에서 보고 있는 모드 탭
  const boardKey = m => m === 'timeattack' ? BOARD_KEY + '-ta' : BOARD_KEY;

  async function fetchBoardRemote(m) {
    const res = await fetch(`${SB_URL}/rest/v1/scores?select=name,score&mode=eq.${m}&order=score.desc,created_at.asc&limit=8`,
      { headers: SB_HEADERS });
    if (res.ok) return res.json();
    // mode 컬럼 마이그레이션 전 호환: 기존 기록은 전부 일반 모드
    if (m === 'normal') {
      const legacy = await fetch(`${SB_URL}/rest/v1/scores?select=name,score&order=score.desc,created_at.asc&limit=8`,
        { headers: SB_HEADERS });
      if (legacy.ok) return legacy.json();
    }
    throw new Error('board fetch ' + res.status);
  }
  async function submitScoreRemote(name, pts, m) {
    const res = await fetch(`${SB_URL}/rest/v1/scores`,
      { method: 'POST', headers: SB_HEADERS, body: JSON.stringify({ name, score: pts, mode: m }) });
    if (!res.ok) throw new Error('submit ' + res.status);
  }

  const loadBoard = m => {
    try { return JSON.parse(localStorage.getItem(boardKey(m))) || []; } catch { return []; }
  };
  function drawBoard(board, offline) {
    boardEl.innerHTML = '';
    if (!board.length) {
      boardEl.innerHTML = '<li class="empty">아직 기록이 없어요</li>';
      return;
    }
    board.forEach((r, i) => {
      const li = document.createElement('li');
      if (i === 0) li.className = 'top';
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = (i + 1) + '.';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = r.name;
      const pts  = document.createElement('span'); pts.className = 'pts';  pts.textContent = fmt(r.score);
      li.append(rank, name, pts);
      boardEl.appendChild(li);
    });
    if (offline) boardEl.insertAdjacentHTML('beforeend', '<li class="empty">(오프라인 — 이 기기의 기록만 표시)</li>');
  }
  function syncBoardTabs() {
    document.querySelectorAll('.board-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.board === boardMode));
  }
  async function renderBoard() {
    syncBoardTabs();
    const m = boardMode;
    boardEl.innerHTML = '<li class="empty">불러오는 중…</li>';
    try {
      const rows = await fetchBoardRemote(m);
      if (boardMode === m) drawBoard(rows, false);
    } catch {
      if (boardMode === m) drawBoard(loadBoard(m), true);
    }
  }
  async function registerRecord() {
    if (nickForm.classList.contains('done')) return;
    const name = (nickInput.value.trim() || '이름없는 땃쥐').slice(0, 8);
    localStorage.setItem(NICK_KEY, name);
    const pts = Math.floor(score);
    const m = mode;
    // 이 기기 기록은 항상 보관 (오프라인 fallback용)
    const board = loadBoard(m);
    board.push({ name, score: pts });
    board.sort((a, b) => b.score - a.score);
    localStorage.setItem(boardKey(m), JSON.stringify(board.slice(0, 8)));
    nickForm.classList.add('done');
    btnNick.textContent = '등록 중…';
    nickInput.blur();
    try {
      await submitScoreRemote(name, pts, m);
      btnNick.textContent = '등록 완료!';
      boardMode = m;
      renderBoard();
      dash.classList.add('open');
    } catch {
      // 전송 실패 — 다시 누를 수 있게 되돌린다
      nickForm.classList.remove('done');
      btnNick.textContent = '실패 — 다시 시도';
      toast('서버 연결 실패 — 등록 버튼을 다시 눌러주세요');
    }
  }

  // ── 게임 상태 ──
  let phase = 'start';      // start | play | over
  let mode = 'normal';      // normal | timeattack
  let state = 1;            // 1 한눈팔기 | 2 고개돌림 | 3 폭발직전
  let score = 0;
  let holding = false;      // 클릭 or 스페이스 유지 중
  let holdStreak = 0;       // 상태1에서 연속으로 쓰다듬은 시간(초) → 점수 가속
  let stateTimer = null;
  let rafId = null;
  let lastT = 0;
  let playStart = 0;        // 난이도 계산용: 이번 판 시작 시각

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  // 0(시작) → 1(최고 난이도). 30초에 걸쳐 점점 어려워진다.
  const difficulty = () => phase === 'play' ? Math.min(1, (performance.now() - playStart) / 30000) : 0;
  const fmt = n => String(Math.floor(n)).padStart(3, '0');

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ── 타임어택 모드: 60초 제한 + 간식(밀웜) + 식사모드 ──
  const TA_TIME = 60;
  const timerEl  = document.getElementById('timer');
  const layerEat = document.getElementById('layer-eat');
  const eatImg1  = document.getElementById('mouse-eat1');
  const eatImg2  = document.getElementById('mouse-eat2');
  let deadline = 0;
  let eating = false, eatUntil = 0, heartClock = 0;
  let snackTimer = null;

  // 간식이 나타날 자리: 땃쥐·점수·안내문·가장자리를 피한 빈 곳에서 랜덤
  function snackSpot() {
    const portrait = document.body.classList.contains('portrait');
    const [W, H] = portrait ? [720, 1280] : [1440, 1024];
    const margin = portrait ? 90 : 130;
    const blocked = portrait
      ? [[0, 0, 330, 260], [30, 300, 700, 1010], [0, 1060, 720, 1280]]
      : [[0, 0, 310, 330], [340, 120, 1070, 850], [0, 850, 1440, 1024]];
    for (let i = 0; i < 40; i++) {
      const x = rand(margin, W - margin - 114);
      const y = rand(margin, H - margin - 100);
      if (!blocked.some(([a, b, c, d]) => x + 114 > a && x < c && y + 100 > b && y < d)) return [x, y];
    }
    return portrait ? [500, 140] : [1180, 420];
  }
  function removeSnack(instant) {
    const s = screens.game.querySelector('.snack');
    if (!s) return;
    clearTimeout(s._life);
    if (instant) s.remove();
    else { s.classList.add('out'); setTimeout(() => s.remove(), 300); }
  }
  function spawnSnack() {
    removeSnack(true);
    const [x, y] = snackSpot();
    const el = document.createElement('div');
    el.className = 'snack';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = '<img src="assets/mealworm.svg">';
    el.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); eatSnack(el); });
    screens.game.appendChild(el);
    el._life = setTimeout(() => { removeSnack(); scheduleSnack(rand(7000, 10000)); }, rand(1800, 2800));
  }
  function scheduleSnack(delay) {
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => {
      if (phase !== 'play' || mode !== 'timeattack') return;
      if (eating || state === 3) { scheduleSnack(1500); return; } // 식사 중이거나 뒤돌아본 때는 나오지 않는다
      spawnSnack();
    }, delay);
  }
  function eatSnack(el) {
    if (phase !== 'play') return;
    clearTimeout(el._life);
    el.remove();
    startEating();
    scheduleSnack(rand(9000, 13000));
  }
  function startEating() {
    eating = true;
    eatUntil = performance.now() + 4000;   // 4초간 식사모드
    heartClock = 0.3;                      // 첫 하트는 바로
    clearTimeout(stateTimer);              // 식사 중엔 화내지 않는다
    state = 1;                             // 쓰다듬어도 안전 + 점수 적립
    layers.forEach(l => l && l.classList.remove('on'));
    screens.game.classList.remove('st3');
    layerEat.classList.add('on');
  }
  function endEating() {
    eating = false;
    layerEat.classList.remove('on');
    layerEat.querySelectorAll('.heart').forEach(h => h.remove());
    setState(1);
  }
  // 하트: 땃쥐 양옆에서 흩날린다 (피그마 식사 프레임의 하트 위치 기준)
  function spawnHeart() {
    const portrait = document.body.classList.contains('portrait');
    const spots = portrait
      ? [[rand(50, 170), rand(600, 860)], [rand(540, 680), rand(420, 640)]]
      : [[rand(390, 550), rand(560, 740)], [rand(950, 1130), rand(290, 470)]];
    const [x, y] = spots[Math.random() < 0.5 ? 0 : 1];
    const el = document.createElement('div');
    el.className = 'heart';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--dx', rand(-55, 55).toFixed(0) + 'px');
    el.innerHTML = `<img src="assets/heart.svg" style="width:${rand(60, 110).toFixed(0)}px">`;
    layerEat.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  function setState(n) {
    if (eating) return;
    state = n;
    layers.forEach((l, i) => l && l.classList.toggle('on', i === n));
    screens.game.classList.toggle('st3', n === 3);

    // 상태3 진입 순간, 이미 쓰다듬고 있으면 즉시 게임오버 (0.01초 룰)
    if (n === 3 && holding) { gameOver(); return; }
    scheduleNext();
  }

  // 상태2가 오는 박자는 일정하지 않고 불규칙하다. 시간이 지날수록 점점 어려워진다.
  function scheduleNext() {
    clearTimeout(stateTimer);
    const d = difficulty();
    let dur;
    if (state === 1) {
      // 짧은 페이크 구간이 섞여 리듬이 어긋난다 — 난이도가 오르면 페이크가 잦아진다
      dur = Math.random() < lerp(0.25, 0.4, d)
        ? rand(0.4, 1.0)
        : rand(lerp(1.8, 0.9, d), lerp(4.6, 2.2, d));
      stateTimer = setTimeout(() => setState(2), dur * 1000);
    } else if (state === 2) {
      // 경고 시간이 점점 짧아진다
      dur = rand(lerp(0.55, 0.3, d), lerp(1.5, 0.8, d));
      stateTimer = setTimeout(() => {
        // 상태3으로 넘어갈 확률이 점점 오른다
        if (Math.random() < lerp(0.45, 0.7, d)) setState(3);
        else setState(1);
      }, dur * 1000);
    } else { // state 3
      dur = rand(0.9, 1.7);
      stateTimer = setTimeout(() => setState(1), dur * 1000);
    }
  }

  // ── 점수 루프 : 상태1에서 유지할수록 가속 누적 ──
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1);
    lastT = t;
    if (phase === 'play') {
      // 타임어택: 남은 시간
      if (mode === 'timeattack') {
        const remain = Math.max(0, Math.ceil((deadline - t) / 1000));
        timerEl.textContent = remain;
        timerEl.classList.toggle('low', remain <= 10);
        if (t >= deadline) gameOver('timeup');
      }
      // 식사모드: 식사1/식사2 교대 + 하트
      if (eating) {
        const open = Math.floor(t / 350) % 2 === 0;
        eatImg1.style.display = open ? 'block' : 'none';
        eatImg2.style.display = open ? 'none' : 'block';
        heartClock += dt;
        if (heartClock >= 0.4) { spawnHeart(); heartClock = 0; }
        if (t >= eatUntil) endEating();
      }
      if (holding && state !== 3) {
        holdStreak += dt;
        let rate = 100 * (1 + Math.min(holdStreak, 5) * 0.25); // 최대 2.25배
        if (state === 2) rate *= 2.5; // 위험을 무릅쓴 쓰다듬기는 보너스
        score += rate * dt;
        scoreGameEl.textContent = fmt(score);
        // 쌓인 득점을 잠깐씩 모아 +00 플로터로 띄운다
        floatAcc += rate * dt;
        floatClock += dt;
        if (floatClock >= 0.2) {
          spawnFloater(Math.round(floatAcc), state === 2);
          floatAcc = 0; floatClock = 0;
        }
      } else if (!holding) {
        holdStreak = 0;
        floatAcc = 0; floatClock = 0;
      }
      mouse1Img.classList.toggle('petting', holding && state === 1 && !eating);
    }
    rafId = requestAnimationFrame(loop);
  }

  // ── 입력 (클릭 + 스페이스) ──
  function press() {
    if (holding) return;
    holding = true;
    cursorImg.src = 'assets/hand2.svg';
    // 상태3에서 0.01초라도 쓰다듬으면 즉시 표호 → 게임오버
    if (phase === 'play' && state === 3) gameOver();
  }
  function release() {
    holding = false;
    cursorImg.src = 'assets/hand1.svg';
  }

  // ── 득점 플로터 ──
  let floatAcc = 0, floatClock = 0;
  function spawnFloater(pts, bonus) {
    if (pts <= 0) return;
    const el = document.createElement('div');
    el.className = 'float-pt' + (bonus ? ' bonus' : '');
    el.textContent = bonus ? '×2.5' : '+' + String(pts).padStart(2, '0');
    const x = parseFloat(cursorEl.style.left) || innerWidth / 2;
    const y = parseFloat(cursorEl.style.top) || innerHeight / 2;
    el.style.left = (x + 52 + rand(-14, 14)) + 'px'; // 손 옆에서, 살짝 흩어지며
    el.style.top  = (y - 18 + rand(-10, 10)) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  let hasPointer = false; // 포인터 위치를 한 번이라도 받았는지 (터치 기기는 hover가 없다)
  function moveCursor(x, y) {
    hasPointer = true;
    cursorEl.style.left = x + 'px';
    cursorEl.style.top  = y + 'px';
  }
  addEventListener('pointerdown', e => {
    moveCursor(e.clientX, e.clientY); // 터치는 누른 지점에서 커서 표시
    if (e.target.closest && e.target.closest('.snack')) return; // 간식 클릭은 쓰다듬기가 아니다
    if (phase === 'play') { e.preventDefault(); press(); }
  });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('blur', release);
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return; // 닉네임 입력 중에는 게임 키 무시
    if (e.code !== 'Space' || e.repeat) return;
    e.preventDefault();
    if (phase === 'play') press();
  });
  addEventListener('keyup', e => { if (e.code === 'Space') release(); });
  addEventListener('contextmenu', e => { if (phase === 'play') e.preventDefault(); });

  // 커서 추적 — Start를 누르면 커서가 hand1로 바뀐다
  addEventListener('pointermove', e => moveCursor(e.clientX, e.clientY));

  // ── 진행 ──
  function startGame(m) {
    phase = 'play';
    mode = m === 'timeattack' ? 'timeattack' : 'normal';
    playStart = performance.now();
    score = 0; holdStreak = 0; holding = false;
    scoreGameEl.textContent = '000';
    eating = false;
    layerEat.classList.remove('on');
    removeSnack(true);
    clearTimeout(snackTimer);
    timerEl.style.display = mode === 'timeattack' ? 'block' : 'none';
    timerEl.classList.remove('low');
    timerEl.textContent = TA_TIME;
    if (mode === 'timeattack') {
      deadline = performance.now() + TA_TIME * 1000;
      scheduleSnack(rand(4000, 6000));
    }
    cursorImg.src = 'assets/hand1.svg';
    cursorEl.style.display = 'block';
    if (!hasPointer) moveCursor(innerWidth / 2, innerHeight / 2); // 첫 입력 전에도 화면 중앙에 보이게
    document.body.classList.add('playing');
    show('game');
    setState(1);
  }

  function gameOver(reason) {
    if (phase !== 'play') return;
    phase = 'over';
    clearTimeout(stateTimer);
    clearTimeout(snackTimer);
    removeSnack(true);
    eating = false;
    layerEat.classList.remove('on');
    release();
    document.body.classList.remove('playing');
    cursorEl.style.display = 'none';
    document.getElementById('ov-msg').textContent = reason === 'timeup'
      ? '시간 종료! 땃쥐는 아직 아쉬운 눈치다...'
      : '땃쥐의 심기를 제대로 건드려버렸다...';

    const final = Math.floor(score);
    const best = Number(localStorage.getItem(BEST_KEY) || 0);
    if (final > best) localStorage.setItem(BEST_KEY, final);
    scoreOverEl.textContent = fmt(final);

    // 닉네임 등록 폼 초기화
    nickForm.classList.remove('done');
    btnNick.textContent = '기록 등록';
    nickInput.value = localStorage.getItem(NICK_KEY) || '';

    if (reason === 'timeup') {
      // 시간 종료는 화내는 게 아니니 흔들림 없이
      setTimeout(() => show('over'), 300);
    } else {
      // 표호: 화면 흔들림 후 게임오버 화면
      wrap.classList.add('shake');
      setTimeout(() => {
        wrap.classList.remove('shake');
        show('over');
      }, 420);
    }
  }

  // ── 모드 고르기: Start를 누르면 모드 선택이 뜬다 ──
  const modeEl = document.getElementById('mode');
  document.getElementById('btn-start').addEventListener('click', () => modeEl.classList.add('open'));
  modeEl.addEventListener('click', e => { if (e.target === modeEl) modeEl.classList.remove('open'); }); // 바깥 누르면 닫기
  document.querySelectorAll('.mode-start').forEach(b => b.addEventListener('click', () => {
    modeEl.classList.remove('open');
    startGame(b.dataset.mode);
  }));
  document.getElementById('btn-retry').addEventListener('click', () => startGame(mode)); // 같은 모드로 재시작

  // ── 대시보드 / 공유 ──
  const dash = document.getElementById('dash');
  document.querySelectorAll('[data-act="dash"]').forEach(b => b.addEventListener('click', () => {
    boardMode = mode; // 마지막으로 플레이한 모드 탭부터
    renderBoard();
    dash.classList.add('open');
  }));
  document.querySelectorAll('.board-tab').forEach(t => t.addEventListener('click', () => {
    boardMode = t.dataset.board;
    renderBoard();
  }));
  document.getElementById('btn-dash-close').addEventListener('click', () => dash.classList.remove('open'));

  btnNick.addEventListener('click', registerRecord);
  nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') registerRecord(); });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  const GAME_URL = 'https://swbaek-rgb.github.io/Ddot.g/';
  document.querySelectorAll('[data-act="share"]').forEach(b => b.addEventListener('click', async () => {
    const best = Number(localStorage.getItem(BEST_KEY) || 0);
    const text = phase === 'over'
      ? `Don't 땃쥐 me — 내 점수 ${fmt(Math.floor(score))}점 (최고 ${fmt(best)}점) 🐭 너도 땃쥐 쓰다듬어봐!`
      : `Don't 땃쥐 me — 땃쥐 쓰다듬기 게임 🐭`;
    if (navigator.share) {
      try { await navigator.share({ title: "Don't 땃쥐 me", text, url: GAME_URL }); } catch {} // 취소해도 조용히 넘어간다
    } else {
      try { await navigator.clipboard.writeText(`${text}\n${GAME_URL}`); toast('게임 링크를 클립보드에 복사했어요!'); }
      catch { toast(GAME_URL); }
    }
  }));

  requestAnimationFrame(t => { lastT = t; loop(t); });

  // 개발 확인용: ?debug=game1|game2|game3|over 로 특정 화면 강제 표시
  const dbg = new URLSearchParams(location.search).get('debug');
  if (dbg) {
    if (dbg.startsWith('game')) {
      show('game');
      const n = Number(dbg.slice(4)) || 1;
      layers.forEach((l, i) => l && l.classList.toggle('on', i === n));
      screens.game.classList.toggle('st3', n === 3);
    } else if (dbg === 'over') { show('over'); }
    else if (dbg === 'mode') { modeEl.classList.add('open'); }
    else if (dbg === 'eat' || dbg === 'snack') {
      show('game');
      document.head.insertAdjacentHTML('beforeend', '<style>.heart,.snack img{animation:none!important;opacity:1!important}</style>');
      if (dbg === 'eat') {
        layers.forEach(l => l && l.classList.remove('on'));
        layerEat.classList.add('on');
        for (let i = 0; i < 4; i++) spawnHeart();
      } else {
        timerEl.style.display = 'block';
        spawnSnack();
      }
    }
  }
})();
</script>
</body>
</html>
