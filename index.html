<body>
<div id="stage-wrap">

  <!-- ══ 시작화면 ══ -->

<script>
(() => {
  'use strict';

  // ── 화면 스케일링: 가로 1440×1024, 세로 720×1280 캔버스를 방향에 따라 전환 ──
  const wrap = document.getElementById('stage-wrap');
  function fit() {
    const portrait = innerHeight > innerWidth;
    document.body.classList.toggle('portrait', portrait);
    const W = portrait ? 720 : 1440;
    const H = portrait ? 1280 : 1024;
    wrap.style.width = W + 'px';
    wrap.style.height = H + 'px';
    const s = Math.min(innerWidth / W, innerHeight / H);
    wrap.style.transform = `translate(-50%, -50%) scale(${s})`;
    // 커서는 화면(고정) 좌표라 스테이지 배율에 맞춰 크기만 조정
    const c = document.getElementById('cursor');
    if (c) c.style.width = Math.max(90, Math.round(190 * s)) + 'px';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 150));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  // ── DOM ──
  const screens = {
    start: document.getElementById('screen-start'),
    game:  document.getElementById('screen-game'),
    over:  document.getElementById('screen-over'),
  };
  const layers = [null,
    document.getElementById('layer-1'),
    document.getElementById('layer-2'),
    document.getElementById('layer-3')];
  const scoreGameEl = document.getElementById('score-game');
  const scoreOverEl = document.getElementById('score-over');
  const mouse1Img   = document.getElementById('mouse1-img');
  const cursorEl    = document.getElementById('cursor');
  const cursorImg   = document.getElementById('cursor-img');
  const toastEl     = document.getElementById('toast');

  const BEST_KEY  = 'ttatjwi-best';
  const BOARD_KEY = 'ttatjwi-board';
  const NICK_KEY  = 'ttatjwi-nick';
  const nickForm  = document.getElementById('nick-form');
  const nickInput = document.getElementById('nick-input');
  const btnNick   = document.getElementById('btn-nick');
  const boardEl   = document.getElementById('board');

  // ── Supabase 공용 랭킹 (실패 시 이 기기의 localStorage 기록으로 동작) ──
  const SB_URL = 'https://rejbmvzkgyiqwfvnjiwr.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlamJtdnprZ3lpcXdmdm5qaXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMjY5MjAsImV4cCI6MjEwNDYwMjkyMH0.D7u_VADNKsWBea4kkraYprnBaqIv4F_sqI_CnSJ5SS4';
  const SB_HEADERS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

  async function fetchBoardRemote() {
    const res = await fetch(`${SB_URL}/rest/v1/scores?select=name,score&order=score.desc,created_at.asc&limit=8`,
      { headers: SB_HEADERS });
    if (!res.ok) throw new Error('board fetch ' + res.status);
    return res.json();
  }
  async function submitScoreRemote(name, pts) {
    const res = await fetch(`${SB_URL}/rest/v1/scores`,
      { method: 'POST', headers: SB_HEADERS, body: JSON.stringify({ name, score: pts }) });
    if (!res.ok) throw new Error('submit ' + res.status);
  }

  const loadBoard = () => {
    try { return JSON.parse(localStorage.getItem(BOARD_KEY)) || []; } catch { return []; }
  };
  function drawBoard(board, offline) {
    boardEl.innerHTML = '';
    if (!board.length) {
      boardEl.innerHTML = '<li class="empty">아직 기록이 없어요</li>';
      return;
    }
    board.forEach((r, i) => {
      const li = document.createElement('li');
      if (i === 0) li.className = 'top';
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = (i + 1) + '.';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = r.name;
      const pts  = document.createElement('span'); pts.className = 'pts';  pts.textContent = fmt(r.score);
      li.append(rank, name, pts);
      boardEl.appendChild(li);
    });
    if (offline) boardEl.insertAdjacentHTML('beforeend', '<li class="empty">(오프라인 — 이 기기의 기록만 표시)</li>');
  }
  async function renderBoard() {
    boardEl.innerHTML = '<li class="empty">불러오는 중…</li>';
    try {
      drawBoard(await fetchBoardRemote(), false);
    } catch {
      drawBoard(loadBoard(), true);
    }
  }
  async function registerRecord() {
    if (nickForm.classList.contains('done')) return;
    const name = (nickInput.value.trim() || '이름없는 땃쥐').slice(0, 8);
    localStorage.setItem(NICK_KEY, name);
    const pts = Math.floor(score);
    // 이 기기 기록은 항상 보관 (오프라인 fallback용)
    const board = loadBoard();
    board.push({ name, score: pts });
    board.sort((a, b) => b.score - a.score);
    localStorage.setItem(BOARD_KEY, JSON.stringify(board.slice(0, 8)));
    nickForm.classList.add('done');
    btnNick.textContent = '등록 중…';
    nickInput.blur();
    try {
      await submitScoreRemote(name, pts);
      btnNick.textContent = '등록 완료!';
    } catch {
      btnNick.textContent = '등록 완료!';
      toast('서버 연결 실패 — 이 기기에만 저장됐어요');
    }
    renderBoard();
    dash.classList.add('open');
  }

  // ── 게임 상태 ──
  let phase = 'start';      // start | play | over
  let state = 1;            // 1 한눈팔기 | 2 고개돌림 | 3 폭발직전
  let score = 0;
  let holding = false;      // 클릭 or 스페이스 유지 중
  let holdStreak = 0;       // 상태1에서 연속으로 쓰다듬은 시간(초) → 점수 가속
  let stateTimer = null;
  let rafId = null;
  let lastT = 0;
  let playStart = 0;        // 난이도 계산용: 이번 판 시작 시각

  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  // 0(시작) → 1(최고 난이도). 30초에 걸쳐 점점 어려워진다.
  const difficulty = () => phase === 'play' ? Math.min(1, (performance.now() - playStart) / 30000) : 0;
  const fmt = n => String(Math.floor(n)).padStart(3, '0');

  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function setState(n) {
    state = n;
    layers.forEach((l, i) => l && l.classList.toggle('on', i === n));
    screens.game.classList.toggle('st3', n === 3);

    // 상태3 진입 순간, 이미 쓰다듬고 있으면 즉시 게임오버 (0.01초 룰)
    if (n === 3 && holding) { gameOver(); return; }
    scheduleNext();
  }

  // 상태2가 오는 박자는 일정하지 않고 불규칙하다. 시간이 지날수록 점점 어려워진다.
  function scheduleNext() {
    clearTimeout(stateTimer);
    const d = difficulty();
    let dur;
    if (state === 1) {
      // 짧은 페이크 구간이 섞여 리듬이 어긋난다 — 난이도가 오르면 페이크가 잦아진다
      dur = Math.random() < lerp(0.25, 0.4, d)
        ? rand(0.4, 1.0)
        : rand(lerp(1.8, 0.9, d), lerp(4.6, 2.2, d));
      stateTimer = setTimeout(() => setState(2), dur * 1000);
    } else if (state === 2) {
      // 경고 시간이 점점 짧아진다
      dur = rand(lerp(0.55, 0.3, d), lerp(1.5, 0.8, d));
      stateTimer = setTimeout(() => {
        // 상태3으로 넘어갈 확률이 점점 오른다
        if (Math.random() < lerp(0.45, 0.7, d)) setState(3);
        else setState(1);
      }, dur * 1000);
    } else { // state 3
      dur = rand(0.9, 1.7);
      stateTimer = setTimeout(() => setState(1), dur * 1000);
    }
  }

  // ── 점수 루프 : 상태1에서 유지할수록 가속 누적 ──
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.1);
    lastT = t;
    if (phase === 'play') {
      if (holding && state !== 3) {
        holdStreak += dt;
        let rate = 100 * (1 + Math.min(holdStreak, 5) * 0.25); // 최대 2.25배
        if (state === 2) rate *= 2.5; // 위험을 무릅쓴 쓰다듬기는 보너스
        score += rate * dt;
        scoreGameEl.textContent = fmt(score);
        // 쌓인 득점을 잠깐씩 모아 +00 플로터로 띄운다
        floatAcc += rate * dt;
        floatClock += dt;
        if (floatClock >= 0.2) {
          spawnFloater(Math.round(floatAcc), state === 2);
          floatAcc = 0; floatClock = 0;
        }
      } else if (!holding) {
        holdStreak = 0;
        floatAcc = 0; floatClock = 0;
      }
      mouse1Img.classList.toggle('petting', holding && state === 1);
    }
    rafId = requestAnimationFrame(loop);
  }

  // ── 입력 (클릭 + 스페이스) ──
  function press() {
    if (holding) return;
    holding = true;
    cursorImg.src = 'assets/hand2.svg';
    // 상태3에서 0.01초라도 쓰다듬으면 즉시 표호 → 게임오버
    if (phase === 'play' && state === 3) gameOver();
  }
  function release() {
    holding = false;
    cursorImg.src = 'assets/hand1.svg';
  }

  // ── 득점 플로터 ──
  let floatAcc = 0, floatClock = 0;
  function spawnFloater(pts, bonus) {
    if (pts <= 0) return;
    const el = document.createElement('div');
    el.className = 'float-pt' + (bonus ? ' bonus' : '');
    el.textContent = bonus ? '×2.5' : '+' + String(pts).padStart(2, '0');
    const x = parseFloat(cursorEl.style.left) || innerWidth / 2;
    const y = parseFloat(cursorEl.style.top) || innerHeight / 2;
    el.style.left = (x + 52 + rand(-14, 14)) + 'px'; // 손 옆에서, 살짝 흩어지며
    el.style.top  = (y - 18 + rand(-10, 10)) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  let hasPointer = false; // 포인터 위치를 한 번이라도 받았는지 (터치 기기는 hover가 없다)
  function moveCursor(x, y) {
    hasPointer = true;
    cursorEl.style.left = x + 'px';
    cursorEl.style.top  = y + 'px';
  }
  addEventListener('pointerdown', e => {
    moveCursor(e.clientX, e.clientY); // 터치는 누른 지점에서 커서 표시
    if (phase === 'play') { e.preventDefault(); press(); }
  });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  addEventListener('blur', release);
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return; // 닉네임 입력 중에는 게임 키 무시
    if (e.code !== 'Space' || e.repeat) return;
    e.preventDefault();
    if (phase === 'play') press();
  });
  addEventListener('keyup', e => { if (e.code === 'Space') release(); });
  addEventListener('contextmenu', e => { if (phase === 'play') e.preventDefault(); });

  // 커서 추적 — Start를 누르면 커서가 hand1로 바뀐다
  addEventListener('pointermove', e => moveCursor(e.clientX, e.clientY));

  // ── 진행 ──
  function startGame() {
    phase = 'play';
    playStart = performance.now();
    score = 0; holdStreak = 0; holding = false;
    scoreGameEl.textContent = '000';
    cursorImg.src = 'assets/hand1.svg';
    cursorEl.style.display = 'block';
    if (!hasPointer) moveCursor(innerWidth / 2, innerHeight / 2); // 첫 입력 전에도 화면 중앙에 보이게
    document.body.classList.add('playing');
    show('game');
    setState(1);
  }

  function gameOver() {
    if (phase !== 'play') return;
    phase = 'over';
    clearTimeout(stateTimer);
    release();
    document.body.classList.remove('playing');
    cursorEl.style.display = 'none';

    const final = Math.floor(score);
    const best = Number(localStorage.getItem(BEST_KEY) || 0);
    if (final > best) localStorage.setItem(BEST_KEY, final);
    scoreOverEl.textContent = fmt(final);

    // 닉네임 등록 폼 초기화
    nickForm.classList.remove('done');
    btnNick.textContent = '기록 등록';
    nickInput.value = localStorage.getItem(NICK_KEY) || '';

    // 표호: 화면 흔들림 후 게임오버 화면
    wrap.classList.add('shake');
    setTimeout(() => {
      wrap.classList.remove('shake');
      show('over');
    }, 420);
  }

  // ── 모드 고르기: Start를 누르면 모드 선택이 뜬다 ──
  const modeEl = document.getElementById('mode');
  document.getElementById('btn-start').addEventListener('click', () => modeEl.classList.add('open'));
  modeEl.addEventListener('click', e => { if (e.target === modeEl) modeEl.classList.remove('open'); }); // 바깥 누르면 닫기
  document.querySelectorAll('.mode-start').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === 'timeattack') { toast('타임어택! 모드는 준비 중이에요 🐛'); return; }
    modeEl.classList.remove('open');
    startGame();
  }));
  document.getElementById('btn-retry').addEventListener('click', startGame);

  // ── 대시보드 / 공유 ──
  const dash = document.getElementById('dash');
  document.querySelectorAll('[data-act="dash"]').forEach(b => b.addEventListener('click', () => {
    renderBoard();
    dash.classList.add('open');
  }));
  document.getElementById('btn-dash-close').addEventListener('click', () => dash.classList.remove('open'));

  btnNick.addEventListener('click', registerRecord);
  nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') registerRecord(); });

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }
  const GAME_URL = 'https://swbaek-rgb.github.io/Ddot.g/';
  document.querySelectorAll('[data-act="share"]').forEach(b => b.addEventListener('click', async () => {
    const best = Number(localStorage.getItem(BEST_KEY) || 0);
    const text = phase === 'over'
      ? `Don't 땃쥐 me — 내 점수 ${fmt(Math.floor(score))}점 (최고 ${fmt(best)}점) 🐭 너도 땃쥐 쓰다듬어봐!`
      : `Don't 땃쥐 me — 땃쥐 쓰다듬기 게임 🐭`;
    if (navigator.share) {
      try { await navigator.share({ title: "Don't 땃쥐 me", text, url: GAME_URL }); } catch {} // 취소해도 조용히 넘어간다
    } else {
      try { await navigator.clipboard.writeText(`${text}\n${GAME_URL}`); toast('게임 링크를 클립보드에 복사했어요!'); }
      catch { toast(GAME_URL); }
    }
  }));

  requestAnimationFrame(t => { lastT = t; loop(t); });

  // 개발 확인용: ?debug=game1|game2|game3|over 로 특정 화면 강제 표시
  const dbg = new URLSearchParams(location.search).get('debug');
  if (dbg) {
    if (dbg.startsWith('game')) {
      show('game');
      const n = Number(dbg.slice(4)) || 1;
      layers.forEach((l, i) => l && l.classList.toggle('on', i === n));
      screens.game.classList.toggle('st3', n === 3);
    } else if (dbg === 'over') { show('over'); }
    else if (dbg === 'mode') { modeEl.classList.add('open'); }
  }
})();
</script>
</body>
</html>
